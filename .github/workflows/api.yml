name: Build api

on:
  push:
    paths:
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/api.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run tsc -w api

      - name: Build
        run: npm run build -w api

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceroid2-server-api
          if-no-files-found: error
          path: api/dist/
