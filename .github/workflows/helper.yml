name: Build helper

on:
  push:
    paths:
      - 'helper/**'
      - '.github/workflows/helper.yml'
  pull_request:
    paths:
      - 'helper/**'
      - '.github/workflows/helper.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: helper

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild Voiceroid2Helper.csproj -t:Restore -property:Configuration=Release

      - name: Build
        run: msbuild Voiceroid2Helper.csproj -property:Configuration=Release -m

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: voiceroid2-helper
          if-no-files-found: error
          path: helper/bin/Release/net481/

      - name: Package release zip
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: Compress-Archive -Path bin/Release/net481/* -DestinationPath ../voiceroid2-helper.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: voiceroid2-helper.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
