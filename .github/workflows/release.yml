name: Release

# GitHub Release を created したときに api + helper をビルドして 1 つの zip にまとめ、
# Release に添付する。タグ push ではなく Release オブジェクトの作成イベントで発火することで、
# 「リリースする意思」を明示する 1 段クッションを挟む。
#
# 使い方:
#   gh release create v0.1.0 --target main --generate-notes
#     ↑ target は必ずブランチ名で指定すること (SHA だと validate ジョブが落とす)
#
# 失敗時の再実行:
#   GitHub UI から該当 run を "Re-run failed jobs"。

on:
  release:
    types: [ created ]

permissions:
  contents: write  # action-gh-release が Release にアセットを追加するのに必要

# 同じタグでの二重発火を防ぐ。並行は禁止だが既存の run を中断はしない (リリース成果物を壊さないため)。
concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release target
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # virchamate-backend の release-prepare.yml と同じ原則:
      # - target_commitish はリモートブランチでなければならない (SHA は拒否)
      # - リリースタグはそのブランチの祖先でなければならない
      # 過去にあった「同じコミットを含む別ブランチへ force-push される事故」を防ぐ。
      - name: Validate target_commitish & tag ancestry
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          TARGET_COMMITISH: ${{ github.event.release.target_commitish }}
        run: |
          git fetch --tags --quiet

          if [ -z "$TARGET_COMMITISH" ]; then
            echo "::error::target_commitish is empty. Release を作るときは target branch を必ず指定してください。"
            exit 1
          fi

          if ! git rev-parse --verify "refs/remotes/origin/$TARGET_COMMITISH" >/dev/null 2>&1; then
            echo "::error::target_commitish='$TARGET_COMMITISH' is not a remote branch."
            echo "GitHub Release は必ずブランチ名 (例: main) を target に指定して作成してください。SHA や削除済みブランチ名は不可。"
            exit 1
          fi

          TAG_SHA=$(git rev-parse "$RELEASE_TAG")
          if ! git merge-base --is-ancestor "$TAG_SHA" "refs/remotes/origin/$TARGET_COMMITISH"; then
            echo "::error::tag $RELEASE_TAG ($TAG_SHA) は origin/$TARGET_COMMITISH に含まれていません。"
            echo "別ブランチで作ったタグから誤ってリリースされるのを防ぐためのチェックです。"
            exit 1
          fi

          echo "OK: $RELEASE_TAG ($TAG_SHA) is on origin/$TARGET_COMMITISH"

  # api ワークスペースを runtime に必要な分だけ揃えて artifact 化する。
  # ・nest build で dist/ を生成
  # ・npm prune --omit=dev で devDependencies を node_modules から除去
  # ・以下の構成で固める (zip 化は package ジョブが担当):
  #   stage/
  #     api/
  #       dist/
  #       package.json
  #       .env.example
  #     node_modules/   ← npm workspace の hoist 先 (api/dist/src/main.js から ../node_modules で解決)
  build-api:
    name: Build api (linux)
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (with devDeps for build)
        run: npm ci

      - name: Build
        run: npm run build -w api

      - name: Prune devDependencies
        run: npm prune --omit=dev

      - name: Stage api bundle
        run: |
          mkdir -p stage/api
          cp -r api/dist stage/api/dist
          cp api/package.json stage/api/
          cp api/.env.example stage/api/.env.example
          cp -r node_modules stage/node_modules

      - name: Upload api stage
        uses: actions/upload-artifact@v4
        with:
          name: voiceroid2-server-api-stage
          if-no-files-found: error
          path: stage/
          # node_modules 内のシンボリックリンク等を保持したいので tar 形式で渡す
          include-hidden-files: true

  # helper の Release ビルド成果 (bin/Release/net481/*) をそのまま artifact 化する。
  # zip 化は package ジョブが担当。
  build-helper:
    name: Build helper (windows)
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: helper
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: microsoft/setup-msbuild@v2

      - name: Restore
        run: msbuild Voiceroid2Helper.csproj -t:Restore -property:Configuration=Release

      - name: Build
        run: msbuild Voiceroid2Helper.csproj -property:Configuration=Release -m

      - name: Upload helper stage
        uses: actions/upload-artifact@v4
        with:
          name: voiceroid2-server-helper-stage
          if-no-files-found: error
          path: helper/bin/Release/net481/

  # api と helper の stage を 1 つの zip にまとめて Release に添付する。
  # 解凍したフォルダ構成:
  #   voiceroid2-server-<tag>/
  #     api/
  #       dist/
  #       package.json
  #       .env.example
  #     helper/
  #       voiceroid2-helper.exe
  #       Codeer.*.dll
  #       (etc.)
  #     node_modules/
  #     init.cmd / init.ps1   ← 初回セットアップ (.env 生成 + 認証コード取得)
  #     start.cmd / start.ps1 ← API サーバー起動
  package:
    name: Package single bundle
    needs: [ build-api, build-helper ]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # スクリプト (init.cmd / start.cmd / *.ps1) を stage に同梱するために checkout する
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Download api stage
        uses: actions/download-artifact@v4
        with:
          name: voiceroid2-server-api-stage
          path: stage/

      - name: Download helper stage
        uses: actions/download-artifact@v4
        with:
          name: voiceroid2-server-helper-stage
          path: stage/helper/

      - name: Copy launch scripts into stage
        run: |
          cp init.cmd init.ps1 start.cmd start.ps1 stage/

      - name: Create bundle zip
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # zip の中の最上位フォルダ名を voiceroid2-server-<tag> にするため、stage を rename してから固める
          mv stage "voiceroid2-server-$RELEASE_TAG"
          zip -r "voiceroid2-server-$RELEASE_TAG.zip" "voiceroid2-server-$RELEASE_TAG"
          ls -lh "voiceroid2-server-$RELEASE_TAG.zip"

      - name: Attach to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: voiceroid2-server-${{ github.event.release.tag_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
